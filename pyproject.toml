[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-agent-logbook"
version = "0.1.0"
description = "Open-source, tamper-evident logbook for AI agents. Runs on your own EU servers, works with any model (MCP)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Delfen B.V." }]
keywords = ["mcp", "ai-agents", "audit-log", "eu-ai-act", "sovereignty", "hash-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
]
dependencies = [
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sovereign-agent-logbook = "sovereign_agent_logbook.server:main"
logbook = "sovereign_agent_logbook.cli:main"

[project.urls]
Homepage = "https://github.com/Delfen-com/sovereign-agent-logbook"
Mirror = "https://codeberg.org/delfen/sovereign-agent-logbook"
Specification = "https://github.com/Delfen-com/sovereign-agent-logbook/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_agent_logbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
